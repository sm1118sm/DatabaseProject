name: Aiven MySQL watchdog

on:
  workflow_dispatch:
  schedule:
    # Keep five-minute intervals, away from the busiest round-minute slots.
    - cron: "2-59/5 * * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: aiven-mysql-watchdog
  cancel-in-progress: false

jobs:
  ensure-mysql-running:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Aiven CLI
        run: python -m pip install --disable-pip-version-check aiven-client

      - name: Monitor and recover Aiven MySQL every 30 seconds
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          AIVEN_PROJECT: ${{ vars.AIVEN_PROJECT }}
          AIVEN_SERVICE: ${{ vars.AIVEN_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AIVEN_TOKEN"
          test -n "$AIVEN_PROJECT"
          test -n "$AIVEN_SERVICE"

          for check_number in {1..10}; do
            state="$({
              avn --auth-token "$AIVEN_TOKEN" service get "$AIVEN_SERVICE" \
                --project "$AIVEN_PROJECT" --json
            } | python -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            echo "Check $check_number/10 - current state: $state"

            if [ "$state" = "POWEROFF" ]; then
              # The CLI's `service update` first reads the service-type list, which needs a permission
              # this application user lacks (403 ProjectServiceTypesGet). Power on through the REST API,
              # which only needs project:services:write, and fall back to the CLI if that fails.
              api="https://api.aiven.io/v1/project/$AIVEN_PROJECT/service/$AIVEN_SERVICE"
              if ! curl -fsS --max-time 30 -X PUT "$api" \
                  -H "Authorization: aivenv1 $AIVEN_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"powered": true}' > /dev/null; then
                echo "REST power-on failed; trying the CLI"
                avn --auth-token "$AIVEN_TOKEN" service update "$AIVEN_SERVICE" \
                  --project "$AIVEN_PROJECT" --power-on
              fi
              # Wait up to ~10 minutes for RUNNING by polling the state we already know how to read.
              for wait_number in {1..40}; do
                sleep 15
                state="$({
                  avn --auth-token "$AIVEN_TOKEN" service get "$AIVEN_SERVICE" \
                    --project "$AIVEN_PROJECT" --json
                } | python -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
                echo "Power-on wait $wait_number/40 - state: $state"
                [ "$state" = "RUNNING" ] && break
              done
            fi

            if [ "$check_number" -lt 10 ]; then
              sleep 30
            fi
          done

          avn --auth-token "$AIVEN_TOKEN" service get "$AIVEN_SERVICE" \
            --project "$AIVEN_PROJECT" --json \
            | python -c 'import json,sys; state=json.load(sys.stdin)["state"]; print(f"Final state: {state}"); raise SystemExit(state != "RUNNING")'
